
<!DOCTYPE html>
<html>
<head>
    <title>Verificação de Acesso</title>
</head>
<body>

    <h2>Verificação de Idade</h2>

    <label>Nome:</label>
    <input type="text" id="nome">

    <br><br>

    <label>Idade:</label>
    <input type="number" id="idade">

    <br><br>

    <button onclick="verificar()">Enviar</button>

    <div id="resultado"></div>

    <script>
        function verificar() {
            let nome = document.getElementById("nome").value;
            let idade = Number(document.getElementById("idade").value);
            let resultado = document.getElementById("resultado");

            if (idade >= 18) {
                resultado.innerHTML = nome + ", acesso permitido!";
            } else {
                resultado.innerHTML = nome + ", acesso negado! Você precisa ter 18 anos ou mais.";
            }
        }
    </script>

</body>
</html>
