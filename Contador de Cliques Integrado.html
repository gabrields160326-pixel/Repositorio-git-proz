<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Contador de Cliques - OneCompiler</title>
</head>
<body>


    <p id="texto">O botão ainda não foi clicado.</p>
    <button id="meuBotao">Clique Aqui</button>


    <script>
        
        const paragrafo = document.getElementById('texto');
        const botao = document.getElementById('meuBotao');

        
        let contador = 0;

        
        botao.addEventListener('click', function() {
            
            contador++; 
            
            
            paragrafo.textContent = `O texto foi alterado com sucesso! Total de cliques: ${contador}`;
        });
    </script>

</body>
</html>
